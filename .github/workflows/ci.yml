name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v2.3-*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository hygiene
        shell: bash
        run: |
          test ! -e .env.local
          test ! -e .env
          if git ls-files --error-unmatch dist >/dev/null 2>&1; then
            echo 'dist/ must not be tracked'
            exit 1
          fi
          mkdir -p dist
          git check-ignore -q dist/
          rm -rf dist

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify generated output is ignored
        shell: bash
        run: |
          test -d dist
          git check-ignore -q dist/
          test -z "$(git ls-files -- dist/)"
