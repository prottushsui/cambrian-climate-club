name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v2.3-*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary audit remediation trial
        shell: bash
        run: |
          npm audit fix --force
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/audit.json","utf8"));
            console.log("AUDIT_SUMMARY " + JSON.stringify(a.metadata?.vulnerabilities));
            console.log("AUDIT_PACKAGES " + JSON.stringify(Object.entries(a.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:x.title)}))));
            console.log("UPDATED_PACKAGE_JSON " + JSON.stringify(JSON.parse(fs.readFileSync("package.json","utf8"))));
            console.log("UPDATED_LOCK_HEAD " + fs.readFileSync("package-lock.json","utf8").slice(0,1000));
          '
          npm run type-check
          npm run lint
          npm run format:check
          npm run check:assets
          npm run build

      - name: Verify repository hygiene
        shell: bash
        run: |
          test ! -e .env.local
          test ! -e .env
          if git ls-files --error-unmatch dist >/dev/null 2>&1; then
            echo 'dist/ must not be tracked'
            exit 1
          fi
          mkdir -p dist
          git check-ignore -q dist/
          rm -rf dist

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Verify static asset references
        run: npm run check:assets

      - name: Build
        run: npm run build

      - name: Verify generated output is ignored
        shell: bash
        run: |
          test -d dist
          git check-ignore -q dist/
          test -z "$(git ls-files -- dist/)"
