name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v2.3-*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Verify repository hygiene
        shell: bash
        run: |
          test ! -e .env.local
          test ! -e .env
          if git ls-files --error-unmatch dist >/dev/null 2>&1; then
            echo 'dist/ must not be tracked'
            exit 1
          fi
          mkdir -p dist
          git check-ignore -q dist/
          rm -rf dist

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Print canonical formatting for review
        run: |
          for file in public/offline.html public/sw.js src/ErrorBoundary.tsx src/pages/ClimateChroniclesPage.tsx; do
            echo "FORMAT-BEGIN:$file"
            npx prettier "$file"
            echo "FORMAT-END:$file"
          done

      - name: Formatting
        run: npm run format:check

      - name: Verify static asset references
        run: npm run check:assets

      - name: Build
        run: npm run build

      - name: Verify generated output is ignored
        shell: bash
        run: |
          test -d dist
          git check-ignore -q dist/
          test -z "$(git ls-files -- dist/)"
