name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v2.3-*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remediate dependencies and migrate Tailwind CSS
        shell: bash
        run: |
          npm audit fix --force
          npm install --save-dev @tailwindcss/postcss
          node --input-type=module -e '
            import fs from "node:fs";
            const postcss = `export default {\n  plugins: {\n    "@tailwindcss/postcss": {},\n  },\n};\n`;
            fs.writeFileSync("postcss.config.js", postcss);
            const css = fs.readFileSync("index.css", "utf8")
              .replace("@tailwind base;\\n@tailwind components;\\n@tailwind utilities;", "@import \\\"tailwindcss\\\";\\n@config \\\"./tailwind.config.js\\\";");
            fs.writeFileSync("index.css", css);
          '
          npm audit --audit-level=low
          npm run type-check
          npm run lint
          npm run format:check
          npm run check:assets
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json index.css postcss.config.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix dependency vulnerabilities and migrate Tailwind CSS"
            git push origin HEAD:main
          fi

      - name: Verify repository hygiene
        shell: bash
        run: |
          test ! -e .env.local
          test ! -e .env
          if git ls-files --error-unmatch dist >/dev/null 2>&1; then
            echo 'dist/ must not be tracked'
            exit 1
          fi
          mkdir -p dist
          git check-ignore -q dist/
          rm -rf dist

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Verify static asset references
        run: npm run check:assets

      - name: Build
        run: npm run build

      - name: Verify generated output is ignored
        shell: bash
        run: |
          test -d dist
          git check-ignore -q dist/
          test -z "$(git ls-files -- dist/)"
